name: 构建并发布 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 恢复固定调试签名
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/jbd-bms-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey >/dev/null
          echo "CI_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          awk -v version="$VERSION_NAME" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md 中缺少版本 $VERSION_NAME 的详细更新记录" >&2
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          APK_NAME="JBD-BMS-Manager-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "电动BMS v${VERSION_NAME}" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "电动BMS v${VERSION_NAME}" \
              --notes-file release-notes.md
          fi
