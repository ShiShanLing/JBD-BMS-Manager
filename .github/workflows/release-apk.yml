name: 构建并发布 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 安装 Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 恢复固定调试签名
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/jbd-bms-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey >/dev/null
          echo "CI_DEBUG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 测试、检查并构建
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: 整理安装包
        id: apk
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          APK_NAME="JBD-BMS-Manager-v${VERSION_NAME}-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK_NAME" \
            --title "JBD BMS 测试版 #${GITHUB_RUN_NUMBER}（v${VERSION_NAME}）" \
            --notes "根据 main 分支提交 ${GITHUB_SHA} 自动构建。下载 APK 后可直接在 Android 12 或更高版本手机上安装测试。" \
            --prerelease \
            --latest=false
