# 放入 HTTP 与 HTTPS server 块内现有的 JBD 更新 location 中。
# App 从 0.4.x 起会发送 User-Agent：JbdBmsManager/<versionName>。
# 0.5.0 以下版本返回 410，不再提供在线版本清单或服务器 APK。

location = /jbd-bms/version.json {
    if ($http_user_agent ~* "^JbdBmsManager/0\.[0-4](\.|$)") { return 410; }
    alias /var/www/jbd-bms/version.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin * always;
}

location ^~ /jbd-bms/ {
    if ($http_user_agent ~* "^JbdBmsManager/0\.[0-4](\.|$)") { return 410; }
    alias /var/www/jbd-bms/;
    autoindex off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin * always;
    types {
        application/vnd.android.package-archive apk;
        application/json json;
    }
    default_type application/octet-stream;
}
